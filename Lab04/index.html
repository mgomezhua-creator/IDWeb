<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Tareas Universitarias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4" style="max-width: 800px;">
    <h1 class="mb-4">Gestor de Tareas Universitarias</h1>

    <div id="alertas"></div>

    <form id="task-form" class="card card-body mb-4" novalidate>
      <div class="row g-3">
        <div class="col-md-12">
          <label for="titulo" class="form-label">Título</label>
          <input type="text" id="titulo" class="form-control" placeholder="Ej. Informe de laboratorio 04">
        </div>
        <div class="col-md-6">
          <label for="curso" class="form-label">Curso</label>
          <input type="text" id="curso" class="form-control" placeholder="Ej. Introducción al Desarrollo Web">
        </div>
        <div class="col-md-6">
          <label for="fechaEntrega" class="form-label">Fecha de entrega</label>
          <input type="date" id="fechaEntrega" class="form-control">
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Agregar tarea</button>
        </div>
      </div>
    </form>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div class="btn-group" id="filtros" role="group">
        <button type="button" class="btn btn-outline-secondary active" data-filter="todas">Todas</button>
        <button type="button" class="btn btn-outline-secondary" data-filter="pendientes">Pendientes</button>
        <button type="button" class="btn btn-outline-secondary" data-filter="completadas">Completadas</button>
      </div>
      <small id="resumen" class="text-muted"></small>
    </div>

    <ul id="task-list" class="list-group"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
