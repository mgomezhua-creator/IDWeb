<h1>Formulario de contacto</h1>
<form action="#" method="post">
    <p>
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre" required>
    </p>

    <p>
        <label for="correo">Correo electrónico:</label><br>
        <input type="email" id="correo" name="correo" required>
    </p>

    <p>
        <label for="asunto">Asunto:</label><br>
        <input type="text" id="asunto" name="asunto">
    </p>

    <p>
        <label for="mensaje">Mensaje:</label><br>
        <textarea id="mensaje" name="mensaje" rows="5" cols="30" required></textarea>
    </p>

    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpiar">
    </p>
</form>

<p>Puedes ponerte en contacto a través de este formulario o correo electrónico.</p>

<address>Hecho el 11 de septiembre del 2026<br>
  por mí mismo.</address>
